name: Release

# Publishing a GitHub release (tag vX.Y.Z) builds a multi-arch image (amd64 + arm64, each on a
# native runner), pushes it to GHCR, signs it with keyless cosign, and attaches the signed
# install files to the release. The installer verifies signatures against this workflow's
# identity (.github/workflows/release.yml at the release tag), so keep this file's path stable.
# A manual run publishes and signs a commit-SHA image tag only.
#
# Signing uploads to Sigstore's public transparency log (Rekor), which occasionally records an
# entry but times out answering; cosign then retries and fails with 409 "an equivalent entry
# already exists". Each signing step therefore retries, with a fresh certificate each time, and
# checks the result the way the installer will.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked

  image:
    name: Build image (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Work out the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # The release tag's version, shown in the app; a manual run is a development build.
          if [[ -n "$TAG" ]]; then version="${TAG#v}"; else version="0.0.0-dev+${GITHUB_SHA::7}"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]] || { echo "not a version: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.image }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: HOMESTOCK_VERSION=${{ steps.version.outputs.version }}
          outputs: type=image,name=${{ steps.image.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish and sign multi-arch image
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - name: Set image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Create multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"

      - name: Read image digest
        id: index
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected digest: $digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          # The index is what installs pull and verify, and it pins each platform's image by
          # digest, so its signature covers them (see the retry note at the top).
          identity="https://github.com/$GITHUB_WORKFLOW_REF"
          for attempt in 1 2 3; do
            cosign sign --yes "$IMAGE@$DIGEST" || true
            if cosign verify "$IMAGE@$DIGEST" --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null; then
              exit 0
            fi
            echo "::warning::signing attempt $attempt did not produce a valid signature"
            sleep $((attempt * 20))
          done
          exit 1

  install-files:
    name: Attach signed install files to the release
    if: github.event_name == 'release'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
      id-token: write # keyless cosign signing
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Package install files
        env:
          TAG: ${{ github.event.release.tag_name }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          version="${TAG#v}"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            scripts/package-release.sh "$version" "$IMAGE:$version@$DIGEST" dist

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign install files
        working-directory: dist
        run: |
          identity="https://github.com/$GITHUB_WORKFLOW_REF"
          for file in *.tar.gz install.sh SHA256SUMS; do
            for attempt in 1 2 3; do
              rm -f -- "$file.sigstore.json"
              cosign sign-blob --yes --bundle "$file.sigstore.json" "$file" || true
              if [[ -s "$file.sigstore.json" ]] && cosign verify-blob --bundle "$file.sigstore.json" \
                --certificate-identity "$identity" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com "$file" >/dev/null; then
                continue 2
              fi
              echo "::warning::signing $file, attempt $attempt, did not produce a valid bundle"
              sleep $((attempt * 20))
            done
            exit 1
          done

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
